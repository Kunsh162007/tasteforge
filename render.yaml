# Render Blueprint: free web service from the Dockerfile.
# Render's proxy keeps Server-Sent Events open, so the long-running /api/brief streams work.
# Free instances sleep after 15 minutes idle and cold-start in about 30 seconds: open the site once before a demo.
services:
  - type: web
    name: tasteforge
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: QLOO_MODE
        value: live # needs QLOO_API_KEY set in the Render dashboard
      - key: QLOO_BASE_URL
        value: https://hackathon.api.qloo.com
      - key: QLOO_API_KEY
        sync: false # set in the Render dashboard
      # Two chains, tried in order; a model that hits a quota or outage cools down and the next one answers.
      # Every Groq model has its own per-minute token limit, so the chains spread the load: FAST (seeds, critic, Taste
      # Proof baseline) starts on the small, quick models, MAIN (brief synthesis) keeps gpt-oss-120b first. A model whose
      # minute budget is nearly spent is passed over before it is called (see GROQ_TOKENS_PER_MINUTE).
      - key: LLM_CHAIN_FAST
        value: groq:openai/gpt-oss-20b,groq:qwen/qwen3.8-27b,groq:openai/gpt-oss-120b,gemini:gemini-2.5-flash,gemini:gemini-3.5-flash-lite
      - key: LLM_CHAIN_MAIN
        value: groq:openai/gpt-oss-120b,groq:qwen/qwen3.8-27b,gemini:gemini-2.5-flash,gemini:gemini-3.5-flash,gemini:gemini-3.5-flash-lite,groq:openai/gpt-oss-20b
      - key: GROQ_TOKENS_PER_MINUTE
        value: "8000" # free-tier limit per Groq model; the x-ratelimit headers refine it at run time
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false # strongly recommended: the first model in both chains
      - key: LEDGER_SECRET
        generateValue: true # signs evidence handed to the browser; keeps shared links verifiable across restarts
      - key: SHOWCASE_ADMIN_TOKEN
        generateValue: true # lets npm run warm -- --regenerate rebuild the showcase (copy it into WARM_TOKEN locally)
      - key: MAX_CONCURRENT_BRIEFS
        value: "4"
      - key: DAILY_LLM_BUDGET
        value: "600"
      - key: SHOWCASE_WARM_ON_BOOT
        value: "1" # build the six showcase briefs one at a time right after boot; npm run warm waits for them
