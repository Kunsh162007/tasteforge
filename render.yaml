# Render Blueprint: free web service from the Dockerfile.
# Render's proxy keeps Server-Sent Events open, so the long-running /api/brief streams work.
# Free instances sleep after 15 minutes idle and cold-start in about 30 seconds: open the site once before a demo.
services:
  - type: web
    name: tasteforge
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: QLOO_MODE
        value: live # needs QLOO_API_KEY set in the Render dashboard
      - key: QLOO_BASE_URL
        value: https://hackathon.api.qloo.com
      - key: QLOO_API_KEY
        sync: false # set in the Render dashboard
      # Two chains, tried in order; a model that hits a quota or outage cools down and the next one answers.
      # FAST: seeds, critic, Taste Proof baseline. MAIN: brief synthesis. Groq first (0.4 to 1 s and about 5 s
      # measured on 2026-10-20), Gemini behind it.
      - key: LLM_CHAIN_FAST
        value: groq:openai/gpt-oss-120b,groq:qwen/qwen3.8-27b,groq:openai/gpt-oss-20b,gemini:gemini-2.5-flash,gemini:gemini-3.5-flash-lite
      - key: LLM_CHAIN_MAIN
        value: groq:openai/gpt-oss-120b,gemini:gemini-2.5-flash,groq:qwen/qwen3.8-27b,gemini:gemini-3.5-flash,gemini:gemini-3.5-flash-lite,groq:openai/gpt-oss-20b
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false # strongly recommended: the first model in both chains
      - key: LEDGER_SECRET
        generateValue: true # signs evidence handed to the browser; keeps shared links verifiable across restarts
      - key: MAX_CONCURRENT_BRIEFS
        value: "4"
      - key: DAILY_LLM_BUDGET
        value: "600"
